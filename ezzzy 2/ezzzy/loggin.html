<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register </title>
    <link rel="stylesheet" href="loggin.css">
</head>
<body>
    <header class="navbar">
    <a class="logo" href="../../index.html">the Margin</a>
    <nav class="na">
        <a href="../../index.html">Posts</a>
        <a href="../../index.html">Home</a>
        <a href="../../ezzzy/reg.html">Get started</a>
    </nav>
    </header>
    
             <section class="inform">
                <form id="loginForm">
                    <h1 class="wel">welcome back.</h1>
                    <p class="and">Sign in to continue writing and reading.</p>
                    <label class="Email">Email</label>
                    <input id="email" type="Email" placeholder="09070639567@gmail.com">
                    <label class="Password">Password</label>
                    <input id="password" type="Password" placeholder="12345678">
                    <button id="LOGING-IN" type="submit">LOGIN</button>
                    <label class="type">Need an account? <a class="sign-up" href="../../ezzzy/reg.html">sign-up</a></label>
                </form>

             </section>
    <footer class="footer">
        <div class="footer-log">the margin</div>
        <div class="footer text">
            a place for ideas worth keeping.
        </div>
    </footer>
    <script src="../../ezzzy6/server.js"></script>
    <script src="../../js/gate.js"></script>
    <script>
    async function loginStudent(email, password) {
         const data = await apiRequest("/api/auth/login", { 
            method: "POST",
             body: JSON.stringify({ email, password }),
             });
             
             localStorage.setItem("token", data.token);
              localStorage.setItem("student", JSON.stringify(data.student));
              
              return data.student;
             } 
             
             document.getElementById("loginForm").addEventListener("submit", async (e) => {
                 e.preventDefault();
                  try { 

                    document.getElementById("LOGING-IN").textContent = "LOGING-IN...";
            document.getElementById("LOGING-IN").disabled = true;
                   
                   console.log("Logging in...")

                    await loginStudent( 
                        document.getElementById("email").value,
                        document.getElementById("password").value
                     );
                        window.location.href = "../../index.html";
                     } catch (err) { 
                        alert(err.message); // e.g. "Invalid email or password"
                 } finally {
                 document.getElementById("LOGING-IN").textContent = "LOGIN";
                 document.getElementById("LOGING-IN").disabled = false;
                 }
                });
    </script>
    <script src="../../js/animations.js"></script>
</body>
</html>
