<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <header class="navbar">
    <div class="logo">the Margin</div>
    <nav class="na">
        <a href="../ezzzy5/last.html">Posts</a>
        <a href="#Sign in">Sign in</a>
        <button href="#get started">Get started</button>
    </nav>
    </header>
    
             <section class="inform">
                <form id="loginForm">
                    <h1 class="wel">welcome back.</h1>
                    <p class="and">Sign in to continue writing and reading.</p>
                    <label class="Email">Email</label>
                    <input id="email" type="Email" placeholder="09070639567@gmail.com">
                    <label class="Password">Password</label>
                    <input id="password" type="Password" placeholder="12345678">
                    <button id="LOGING-IN" type="submit">LOGIN</button>
                    <label class="type">already have an account? <a class="sign-up" href="">sign-up </a></label>
                </form>

             </section>
    <footer class="footer">
        <div class="footer-log">the margin</div>
        <div class="footer text">
            a place for ideas worth keeping.
        </div>
    </footer>
    <script src="../ezzzy6/server.js"></script>
    <script>
    async function loginStudent(email, password) {
         const data = await apiRequest("/api/auth/login", { 
            method: "POST",
             body: JSON.stringify({ email, password }),
             });
             
             localStorage.setItem("token", data.token);
              localStorage.setItem("student", JSON.stringify(data.student));
              
              return data.student;
             } 
             
             document.getElementById("loginForm").addEventListener("submit", async (e) => {
                 e.preventDefault();
                  try { 

                    document.getElementById("LOGING-IN").textContent = "LOGING-IN...";
            document.getElementById("LOGING-IN").ariaDisabled = true;
                   
                   console.log("Logging in...")

                    await loginStudent( 
                        document.getElementById("email").value,
                        document.getElementById("password").value
                     );
                        window.location.href = "../ezzzy7/ezzzy.html";
                     } catch (err) { 
                        alert(err.message); // e.g. "Invalid email or password"
                 } finally {
                 document.getElementById("LOGING-IN").textContent = "LOGIN";
                 document.getElementById("LOGING-IN").ariaDisabled = false;
                 }
                });
    </script>
 </html>
