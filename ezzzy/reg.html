    <script>
        async function registerStudent(fullName, email, password) {
         const data = await apiRequest("/api/auth/register", {
             method: "POST",
              body: JSON.stringify({ fullName, email, password, department: "Computer science", level: "300" }),
              }); // data = { token, tokenType, student: {...} } 
               localStorage.setItem("token", data.token);
               localStorage.setItem("student", JSON.stringify(data.student));
                
         return data.student;
        }
        
       document.getElementById("registerForm").addEventListener("submit", async (e) => {
         e.preventDefault(); // stop the page from reloading
         try {

            document.getElementById("LOGING-IN").textContent = "Registering...";
            document.getElementById("LOGING-IN").disabled = true;
         const student = await registerStudent(
                document.getElementById("fullName").value,
                document.getElementById("email").value,
                document.getElementById("password").value
            );
                   window.location.href = "../index.html"; // go to the homepage
                    } catch (err) {
                    console.error(err);
                    } finally{
                        document.getElementById("LOGING-IN").textContent= "create account";
                        document.getElementById("LOGING-IN").disabled = false;
                    } 
                }); 
    </script>
